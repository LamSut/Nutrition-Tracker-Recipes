name: ct312h_project
description: 'A new Flutter project.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  provider: ^6.1.2

flutter:
  uses-material-design: true

  assets:
  - assets/foods/
  - assets/fonts/
  - assets/avatars/

  fonts:
    - family: Calibri
      fonts:
        - asset: assets/fonts/calibri-regular.ttf
        - asset: assets/fonts/calibri-bold.ttf
          weight: 800
